<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Chat</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 100%;
            margin: auto;
            background-color: #f9f9f9;
        }
        h2 { color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        select, textarea, button {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 15px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0056b3; }
        button:disabled {
            background-color: #7ab3f5;
            cursor: not-allowed;
        }
        #setupBtn {
            background-color: #28a745;
        }
        #setupBtn:active { background-color: #1e7e34; }
        #output {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 80px;
            font-size: 15px;
            line-height: 1.5;
        }
        #status {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .chat-container {
            display: none; /* Hidden until quick authorization succeeds */
        }
    </style>
</head>
<body>
    <h2>🤖 My AI Chat</h2>
    <div id="status">⏳ Initializing Secure Connection...</div>

    <button id="setupBtn">⚡ Quick Activate Chat (No Login Needed)</button>

    <div id="chatInterface" class="chat-container">
        <label for="modelSelect">Choose a Model:</label>
        <select id="modelSelect">
            <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="claude-3-5-haiku">Claude 3.5 Haiku</option>
            <option value="gemini-1-5-flash">Gemini 1.5 Flash</option>
        </select>

        <label for="promptInput">Your Question:</label>
        <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>

        <button id="sendBtn">Send to AI</button>

        <label>Response:</label>
        <div id="output">Ready for your question...</div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const setupBtn = document.getElementById('setupBtn');
        const chatInterface = document.getElementById('chatInterface');
        const btn = document.getElementById('sendBtn');
        const outputDiv = document.getElementById('output');
        const statusDiv = document.getElementById('status');
        const promptInput = document.getElementById('promptInput');
        const modelSelect = document.getElementById('modelSelect');

        // Check backend authentication status seamlessly
        function checkAuth() {
            if (puter.auth.isSignedIn()) {
                statusDiv.innerText = '✅ Chat Activated via Secure Session!';
                statusDiv.style.color = '#28a745';
                setupBtn.style.display = 'none';
                chatInterface.style.display = 'block';
            } else {
                statusDiv.innerText = '👋 Welcome! Tap the green button below to initialize your free environment.';
                statusDiv.style.color = '#007bff';
                setupBtn.style.display = 'block';
                chatInterface.style.display = 'none';
            }
        }

        // Run checking instantly on page render
        checkAuth();

        // High-priority click handler utilizing background temporary session token configuration
        setupBtn.addEventListener('click', function() {
            statusDiv.innerText = '⏳ Allocating cloud resources...';
            
            // This flag bypasses interactive popup login forms entirely on mobile environments
            puter.auth.signIn({ attempt_temp_user_creation: true })
                .then(function(res) {
                    checkAuth();
                })
                .catch(function(err) {
                    statusDiv.innerText = '❌ Activation failed: ' + (err.message || 'Unknown error');
                    statusDiv.style.color = '#dc3545';
                });
        });

        // Ctrl+Enter shortcut deployment
        promptInput.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                askAI();
            }
        });

        btn.addEventListener('click', askAI);

        function askAI() {
            const prompt = promptInput.value;
            const model = modelSelect.value;

            if (!prompt.trim()) {
                outputDiv.innerText = 'Please type a question first!';
                return;
            }

            outputDiv.innerText = 'Thinking...';
            btn.innerText = 'Wait...';
            btn.disabled = true;

            puter.ai.chat(prompt, { model: model })
            .then(response => {
                if (response?.message?.content?.[0]?.text) {
                    outputDiv.innerText = response.message.content[0].text;
                } else if (typeof response === 'string') {
                    outputDiv.innerText = response;
                } else {
                    outputDiv.innerText = JSON.stringify(response, null, 2);
                }
            })
            .catch(error => {
                outputDiv.innerText = '❌ Error: ' + (error.message || JSON.stringify(error));
            })
            .finally(() => {
                btn.innerText = 'Send to AI';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
