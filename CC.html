<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Chat</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 100%;
            margin: auto;
            background-color: #f9f9f9;
        }
        h2 { color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        select, textarea, button {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 15px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0056b3; }
        button:disabled {
            background-color: #7ab3f5;
            cursor: not-allowed;
        }
        #loginBtn {
            background-color: #28a745;
            display: none; /* Hidden by default, shown if needed */
        }
        #loginBtn:active { background-color: #1e7e34; }
        #output {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 80px;
            font-size: 15px;
            line-height: 1.5;
        }
        #status {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .chat-container {
            display: none; /* Hidden until authenticated */
        }
    </style>
</head>
<body>
    <h2>🤖 My AI Chat</h2>
    <div id="status">⏳ Initializing Puter...</div>

    <button id="loginBtn">🔒 Sign In with Puter Account</button>

    <div id="chatInterface" class="chat-container">
        <label for="modelSelect">Choose a Model:</label>
        <select id="modelSelect">
            <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
            <option value="claude-opus-4-6">Claude Opus 4.6 (Most Powerful)</option>
            <option value="claude-haiku-4-5">Claude Haiku 4.5 (Fastest)</option>
            <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
        </select>

        <label for="promptInput">Your Question:</label>
        <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>

        <button id="sendBtn">Send to AI</button>

        <label>Response:</label>
        <div id="output">Ready for your question...</div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const chatInterface = document.getElementById('chatInterface');
        const btn = document.getElementById('sendBtn');
        const outputDiv = document.getElementById('output');
        const statusDiv = document.getElementById('status');
        const promptInput = document.getElementById('promptInput');
        const modelSelect = document.getElementById('modelSelect');

        // Check authentication state right after script loads
        function checkAuth() {
            if (puter.auth.isSignedIn()) {
                statusDiv.innerText = '✅ Puter Authenticated & Ready!';
                statusDiv.style.color = '#28a745';
                loginBtn.style.display = 'none';
                chatInterface.style.display = 'block';
            } else {
                statusDiv.innerText = '⚠️ Action Required: Please sign in to unlock free API access.';
                statusDiv.style.color = '#dc3545';
                loginBtn.style.display = 'block';
                chatInterface.style.display = 'none';
            }
        }

        // Run checking instantly
        checkAuth();

        // Manual Login Click Handler (Bypasses popup blocker because it's a direct click)
        loginBtn.addEventListener('click', async () => {
            statusDiv.innerText = '⏳ Opening Login Window...';
            try {
                await puter.auth.signIn();
                checkAuth(); // Re-evaluate UI elements on success
            } catch (err) {
                statusDiv.innerText = '❌ Sign-in failed. Ensure popups are allowed for this site.';
                console.error(err);
            }
        });

        // Ctrl+Enter shortcut execution
        promptInput.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                askAI();
            }
        });

        btn.addEventListener('click', askAI);

        function askAI() {
            const prompt = promptInput.value;
            const model = modelSelect.value;

            if (!prompt.trim()) {
                outputDiv.innerText = 'Please type a question first!';
                return;
            }

            outputDiv.innerText = 'Thinking...';
            btn.innerText = 'Wait...';
            btn.disabled = true;

            puter.ai.chat(prompt, { model: model })
            .then(response => {
                if (response?.message?.content?.[0]?.text) {
                    outputDiv.innerText = response.message.content[0].text;
                } else if (typeof response === 'string') {
                    outputDiv.innerText = response;
                } else {
                    outputDiv.innerText = JSON.stringify(response, null, 2);
                }
            })
            .catch(error => {
                outputDiv.innerText = '❌ Error: ' + (error.message || JSON.stringify(error));
            })
            .finally(() => {
                btn.innerText = 'Send to AI';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
