<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Chat</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 100%;
            margin: auto;
            background-color: #f9f9f9;
        }
        h2 { color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        select, textarea, button {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 15px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0056b3; }
        button:disabled {
            background-color: #7ab3f5;
            cursor: not-allowed;
        }
        #output {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 80px;
            font-size: 15px;
            line-height: 1.5;
        }
        #status {
            font-size: 13px;
            color: #007bff;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🤖 My AI Chat</h2>
    <div id="status">⏳ Initializing Connection...</div>

    <label for="modelSelect">Choose a Model:</label>
    <select id="modelSelect">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
        <option value="claude-opus-4-6">Claude Opus 4.6</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
    </select>

    <label for="promptInput">Your Question:</label>
    <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>

    <button id="sendBtn" disabled>Connecting...</button>

    <label>Response:</label>
    <div id="output">Establishing live API channel...</div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const btn = document.getElementById('sendBtn');
        const outputDiv = document.getElementById('output');
        const statusDiv = document.getElementById('status');
        const promptInput = document.getElementById('promptInput');
        const modelSelect = document.getElementById('modelSelect');

        // Bypassing login completely by running a seamless anonymous session handoff
        puter.auth.signIn({ attempt_temp_user_creation: true })
            .then(() => {
                statusDiv.innerText = '✅ Puter Engine Active!';
                statusDiv.style.color = '#28a745';
                btn.innerText = 'Send to AI';
                btn.disabled = false;
                outputDiv.innerText = 'Ready for your question...';
            })
            .catch((err) => {
                // If local environment (like Acode) blocks it, we force enable the button anyway
                statusDiv.innerText = '⚠️ Local sandbox environment detected.';
                statusDiv.style.color = '#e67e22';
                btn.innerText = 'Send to AI (Try Anyway)';
                btn.disabled = false;
                outputDiv.innerText = 'Ready to execute request...';
            });

        // Ctrl+Enter shortcut execution
        promptInput.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if(!btn.disabled) askAI();
            }
        });

        btn.addEventListener('click', askAI);

        function askAI() {
            const prompt = promptInput.value;
            const selectedModel = modelSelect.value;

            if (!prompt.trim()) {
                outputDiv.innerText = 'Please type a question first!';
                return;
            }

            outputDiv.innerText = 'Thinking...';
            btn.innerText = 'Wait...';
            btn.disabled = true;

            // Using standard tutorial-compliant execution block
            puter.ai.chat(prompt, { model: selectedModel })
            .then(response => {
                // Exact response property handler extracted from tutorial documentation
                if (response?.message?.content) {
                    outputDiv.innerText = response.message.content;
                } else if (typeof response === 'string') {
                    outputDiv.innerText = response;
                } else {
                    outputDiv.innerText = JSON.stringify(response, null, 2);
                }
            })
            .catch(error => {
                outputDiv.innerText = '❌ Error: ' + (error.message || JSON.stringify(error));
            })
            .finally(() => {
                btn.innerText = 'Send to AI';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
